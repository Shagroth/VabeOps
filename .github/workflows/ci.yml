name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege by default; nothing here needs more than read access.
permissions:
  contents: read

# Cancel a superseded run on the same branch/PR instead of letting both finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder only — resolves to nothing reachable from CI, never a
  # real database. Just enough for Prisma client generation/validation
  # and for `next build` to not fail if a route happens to touch
  # src/lib/prisma.ts's module-level env check. No step here migrates,
  # pushes, or otherwise connects to this (or any real) database.
  DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/vabeops_ci"
  AUTH_SECRET: "ci-placeholder-secret-not-used-anywhere-real"
  AUTH_RESEND_KEY: "ci-placeholder-not-a-real-resend-key"
  EMAIL_FROM: "VabeOps CI <ci@vabeops.invalid>"
  NEXT_PUBLIC_SITE_URL: "https://vabeops.example.com"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
